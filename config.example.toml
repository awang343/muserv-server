# Copy to config.toml and edit.

# HTTP bind address.
bind = "127.0.0.1:7700"

# One or more libraries. Names must be unique and are user-visible. Each
# library is fully independent: `path` is a plain directory muserv owns,
# containing only that library's own `library.db` and a content-addressed
# `.storage` folder, both created on first run. New music is added via
# `muserv import --library <name> --path <dir>` (bulk-imports a folder) or
# a downloader script — nothing should be dropped directly into `path`.
# The order here controls each library's id and the default sort in
# clients — reordering or removing entries reassigns ids.
#
# `read_users` / `write_users` / `upload_users` grant access by username —
# see the `[[user]]` section below for how usernames are defined. A library
# that doesn't list a user in any of these is completely invisible to them:
# it's left out of `GET /api/libraries` and every endpoint under it 404s
# exactly as if the library didn't exist.
#
#   read_users   — see the library and browse it: tracks, albums, artists,
#                  playlists, tags, search, streaming
#   write_users  — create/rename/delete playlists and their tracks, add/remove tags
#   upload_users — run downloader scripts against the library
[[library]]
name = "main"
path = "/path/to/your/music"
# read_users = ["alan", "guest"]
# write_users = ["alan"]
# upload_users = ["alan"]

# [[library]]
# name = "podcasts"
# path = "/path/to/your/podcasts"
# read_users = ["alan"]

# Optional. Directory of executable downloader scripts clients can run to
# pull music straight into the currently selected library — see
# scripts/downloaders/example.sh for the contract scripts must follow and
# scripts/downloaders/yt-dlp.sh for a real one. Unset means the downloaders
# API returns an empty list.
# downloaders_path = "/path/to/muserv/scripts/downloaders"

# Required to use the API at all. Every request must present
# `Authorization: Basic <base64(username:token)>` matching a configured user
# below — with no [[user]] sections defined, every request is rejected with
# 401 (the API fails closed, not open).
#
# Each user just needs a unique username and a token (generate one with
# `openssl rand -hex 32`). What they can actually access is controlled by the
# `read_users` / `write_users` / `upload_users` lists on each `[[library]]`
# above.
#
# [[user]]
# username = "alan"
# token = "paste-a-long-random-string-here"
#
# [[user]]
# username = "guest"
# token = "paste-a-different-long-random-string-here"
