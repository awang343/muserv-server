# Copy to config.toml and edit.

# HTTP bind address.
bind = "127.0.0.1:7700"

# One or more libraries. Names must be unique and are user-visible. Each
# library is fully independent: `path` is a plain directory muserv owns,
# containing only that library's own `library.db` and a content-addressed
# `.storage` folder, both created on first run. New music is added via
# `muserv import --library <name> --path <dir>` (bulk-imports a folder) or
# a downloader script — nothing should be dropped directly into `path`.
# The order here controls each library's id and the default sort in
# clients — reordering or removing entries reassigns ids.
[[library]]
name = "main"
path = "/path/to/your/music"

# [[library]]
# name = "podcasts"
# path = "/path/to/your/podcasts"

# Optional. Directory of executable downloader scripts clients can run to
# pull music straight into the currently selected library — see
# scripts/downloaders/example.sh for the contract scripts must follow and
# scripts/downloaders/yt-dlp.sh for a real one. Unset means the downloaders
# API returns an empty list.
# downloaders_path = "/path/to/muserv/scripts/downloaders"

# Optional. If no [[user]] sections are defined, the API is open — no auth
# required. Fine for a loopback-only bind, never for anything reachable over
# a network. Once you add users, every request must present
# `Authorization: Basic <base64(username:token)>` matching one of them.
#
# Each user needs a unique username and a token (generate one with
# `openssl rand -hex 32`), plus a [[user.library]] block per library they
# should have any access to. A library with no matching block for a user is
# completely invisible to them — it's left out of `GET /api/libraries` and
# every endpoint under it 404s exactly as if the library didn't exist.
#
#   read   — see the library and browse it: tracks, albums, artists,
#            playlists, tags, search, streaming
#   write  — create/rename/delete playlists and their tracks, add/remove tags
#   upload — run downloader scripts against the library
#
# [[user]]
# username = "alan"
# token = "paste-a-long-random-string-here"
#
#   [[user.library]]
#   name = "main"
#   read = true
#   write = true
#   upload = true
#
# [[user]]
# username = "guest"
# token = "paste-a-different-long-random-string-here"
#
#   [[user.library]]
#   name = "main"
#   read = true
